<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soltech Energy | Solar Solutions Jaipur</title>
    <meta name="description" content="Soltech Energy provides residential and commercial solar installation services in Jaipur and Rajasthan.">
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <button id="chat-toggle" class="chat-toggle">
        <i class="fas fa-comments"></i>
        <span class="notification-dot"></span>
    </button>

    <div id="chatbot-container" class="chatbot-container">
<div id="chatbot-container" class="chatbot-container">
    
    <div class="chat-header">
        <div class="header-info">
            <img src="logo.jpg" alt="Soltech Logo" class="chat-company-logo">
            <div>
                <h4>Soltech Assistant</h4>
                <span class="status-indicator">Online</span>
            </div>
        </div>
        <div class="header-actions">
            <div class="lang-switcher">
                <button id="lang-en" class="lang-btn active">EN</button>
                <button id="lang-hi" class="lang-btn">हि</button>
            </div>
            <button id="refresh-chat"><i class="fas fa-sync-alt"></i></button>
            <button id="minimize-chat"><i class="fas fa-minus"></i></button>
        </div>
    </div>

    <div class="horizontal-tabs-nav">
        <button class="tab-nav-btn" onclick="startFlow('ESTIMATOR')">💰 Cost Calc</button>
        <button class="tab-nav-btn" onclick="startFlow('ESTIMATOR')">📈 Savings</button>
        <button class="tab-nav-btn" onclick="triggerGatedWall('Subsidy Info')">📋 Subsidy</button>
        <button class="tab-nav-btn" onclick="startFlow('SITE_VISIT')">🗓️ Book Survey</button>
    </div>

    <div id="chat-box" class="chat-box">
        </div>

    <div class="chat-footer">
        <button id="footer-whatsapp-cta" class="whatsapp-btn">CONNECT VIA WHATSAPP</button>
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Type your solar query here...">
            <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

    <script src="intents.js"></script>
    <script src="chatbot.js"></script>

</body>
</html>
