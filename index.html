<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soltech Energy | Solar Solutions Jaipur</title>
    <meta name="description" content="Soltech Energy provides residential and commercial solar installation services in Jaipur and Rajasthan.">
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <button id="chat-toggle" class="chat-toggle" aria-label="Open Soltech Energy chat" aria-expanded="false">
        <i class="fas fa-comments"></i>
        <span class="notification-dot"></span>
    </button>

    <div id="chatbot-container" class="chatbot-container">
        <div class="chat-header">
            <div class="chat-header-brand">
                <div class="chat-header-logo-outer-ring">
                    <div class="chat-header-logo-inner-ring">
                        <img src="logo.jpg" alt="Soltech Energy">
                    </div>
                </div>
                <div class="header-info">
                    <span class="welcome-title">Soltech Energy Assistant</span>
                    <span class="status-indicator"><span></span> Online</span>
                </div>
            </div>

            <div class="header-actions">
                <div class="lang-switcher" aria-label="Language selector">
                    <button id="lang-en" class="lang-btn active-lang" type="button">EN</button>
                    <button id="lang-hi" class="lang-btn" type="button">HI</button>
                </div>
                <button id="refresh-chat" type="button" aria-label="Refresh chat">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button id="minimize-chat" type="button" aria-label="Minimize chat">
                    <i class="fas fa-minus"></i>
                </button>
            </div>
        </div>

        <div class="horizontal-tabs-nav">
            <button id="tab-solar-solutions" class="tab-nav-btn" type="button" onclick="openSolarSolutionsTab()">
                <i class="fas fa-solar-panel"></i> Solar Solutions
            </button>
            <button id="tab-subsidy" class="tab-nav-btn" type="button" onclick="openSubsidyTab()">
                <i class="fas fa-file-invoice"></i> Subsidy
            </button>
            <button id="tab-survey" class="tab-nav-btn" type="button" onclick="openBookSurveyTab()">
                <i class="fas fa-calendar-check"></i> Book Survey
            </button>
        </div>

        <div id="chat-box" class="chat-box"></div>

        <div id="chat-typing-indicator" class="typing-indicator-wrapper hidden">
            <div class="typing-bubble">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="chat-footer">
            <a id="footer-whatsapp-cta"
               class="whatsapp-footer-cta"
               href="https://wa.me/918239573979?text=Hi%21%20I%20want%20to%20check%20solar%20details%20for%20my%20property."
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Connect with Soltech Energy on WhatsApp">
                <i class="fab fa-whatsapp"></i> Connect via WhatsApp
            </a>
            <div class="typing-row">
                <input type="text" id="user-input" placeholder="Type your solar inquiry here..." autocomplete="off">
                <button id="send-btn" type="button" aria-label="Send message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="{{ asset('js/chatbot.js') }}"></script>
</body>
</html>
