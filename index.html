<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soltech Energy | Solar Solutions Jaipur</title>
    <!-- Use standard stable FontAwesome CDN link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chatbot.css">
</head>
<body>

    <!-- Launcher -->
    <div id="chat-toggle-container">
        <div id="chat-launcher-tooltip">☀️ Calculate Solar Cost & Savings Live!</div>
        <button id="chat-toggle" class="chat-toggle">
            <i class="fas fa-comments"></i>
            <span class="notification-dot"></span>
        </button>
    </div>

    <!-- Chat Window Frame -->
    <div id="chatbot-container" class="chatbot-container">
        
        <!-- Re-Architected Flex Header Container Grid -->
        <div class="chat-header">
            <div class="header-left">
                <div class="bot-avatar">
                    <img src="logo.jpg" id="chat-logo-fallback" alt="Soltech Logo">
                </div>
                <div class="header-titles">
                    <h3>Soltech Assistant</h3>
                    <span class="status"><span class="online-indicator-dot"></span> Online</span>
                </div>
            </div>
            
            <!-- Safe Header Operations Section -->
            <div class="header-actions">
                <div class="lang-switcher-pill">
                    <button class="lang-btn active" data-lang="EN">EN</button>
                    <button class="lang-btn" data-lang="HI">HI</button>
                </div>
                <button id="refresh-chat" class="control-action-btn" title="Restart Chat">
                    <i class="fas fa-rotate-right"></i>
                </button>
                <button id="minimize-chat" class="control-action-btn" title="Minimize">
                    <i class="fas fa-minus"></i>
                </button>
            </div>
        </div>

        <!-- Persistent Navigation Tabs -->
        <div class="persistent-tabs-grid">
            <div class="persistent-tab-item" data-intent="Cost Calculator">💰 Cost Calc</div>
            <div class="persistent-tab-item" data-intent="Savings Calculator">📈 Savings</div>
            <div class="persistent-tab-item" data-intent="Subsidy Info">📋 Subsidy</div>
            <div class="persistent-tab-item" data-intent="Book Site Survey" style="color:#e65100;">📅 Book Survey</div>
        </div>

        <!-- Progress and Content Stream -->
        <div id="lead-progress" class="lead-progress hidden">
            <div class="progress-bar"><div id="progress-fill"></div></div>
            <small>Solar Assessment Progress</small>
        </div>
        
        <div id="chat-box" class="chat-box"></div>

        <!-- Footer Control Console Unit -->
        <div class="chat-input-container"> 
            <div id="submenu-controls-wrapper" class="quick-actions-wrapper"></div>

            <button class="whatsapp-footer-cta" id="footer-whatsapp-cta">
                 <i class="fab fa-whatsapp"></i> CONNECT VIA WHATSAPP
            </button>

            <!-- Correctly Wrapped Typing Box Console -->
            <div class="typing-row">
                 <input type="text" id="user-input" placeholder="Type your solar query here...">
                 <button id="send-btn">
                    <i class="fas fa-paper-plane"></i>
                 </button>
            </div>
        </div>
    </div>

    <script src="intents.js"></script>
    <script src="chatbot.js"></script>
</body>
</html>
