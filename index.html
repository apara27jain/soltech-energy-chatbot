<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soltech Energy | Solar Solutions Jaipur</title>
    <meta name="description" content="Soltech Energy provides residential and commercial solar installation services in Jaipur and Rajasthan.">
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <button id="chat-toggle" class="chat-toggle">
        <i class="fas fa-comments"></i>
        <span class="notification-dot"></span>
    </button>

    <div id="chatbot-container" class="chatbot-container">
        
        <div class="chat-header">
            <div class="header-info">
                <span class="welcome-title" style="font-size: 14px; font-weight: 600;">Soltech Energy Assistant</span>
                <span class="status-indicator" style="font-size: 11px; display: flex; align-items: center; gap: 4px; margin-top: 2px;">
                    <span style="width: 6px; height: 6px; background-color: #34d399; border-radius: 50%; display: inline-block;"></span> Online
                </span>
            </div>
            <div class="header-actions">
                <div class="lang-switcher">
                    <button id="lang-en" class="lang-btn active-lang">EN</button>
                    <button id="lang-hi" class="lang-btn">हि</button>
                </div>
                <button id="refresh-chat" style="background: none; border: none; color: white; cursor: pointer; margin-left: 8px;"><i class="fas fa-sync-alt"></i></button>
                <button id="minimize-chat" style="background: none; border: none; color: white; cursor: pointer; margin-left: 8px;"><i class="fas fa-minus"></i></button>
            </div>
        </div>

        <div id="lead-progress" class="lead-progress hidden">
            <div id="progress-bar-fill"></div>
        </div>

        <div class="horizontal-tabs-nav">
            <button id="tab-cost-calc" class="tab-nav-btn" onclick="startFlow('ESTIMATOR')">💰 Cost Calc</button>
            <button id="tab-savings" class="tab-nav-btn" onclick="startFlow('ESTIMATOR')">📈 Savings</button>
            <button id="tab-subsidy" class="tab-nav-btn" onclick="triggerGatedWall('Subsidy Info')">📋 Subsidy</button>
            <button id="tab-survey" class="tab-nav-btn" onclick="startFlow('SITE_VISIT')">🗓️ Book Survey</button>
        </div>

        <div id="chat-box" class="chat-box"></div>

        <div id="chat-typing-indicator" class="typing-indicator-wrapper hidden">
            <div class="typing-bubble">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="chat-footer">
            <button id="footer-whatsapp-cta" class="whatsapp-footer-cta">
                <i class="fab fa-whatsapp"></i> CONNECT VIA WHATSAPP
            </button>
            <div class="typing-row">
                <input type="text" id="user-input" placeholder="Type your solar inquiry here..." autocomplete="off">
                <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

    </div>

    <script src="chatbot.js"></script>
</body>
</html>
